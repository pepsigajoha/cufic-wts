name: Supabase Keep-Alive

# Supabase 무료 플랜은 약 1주일 동안 요청이 없으면 프로젝트(DB)를 일시정지한다.
# 매일 한 번 가벼운 읽기 요청을 보내 깨어 있게 유지한다.
#   필요한 저장소 시크릿(Settings → Secrets and variables → Actions):
#     SUPABASE_URL       = .env 의 VITE_SUPABASE_URL
#     SUPABASE_ANON_KEY  = .env 의 VITE_SUPABASE_ANON_KEY  (원래 공개용 키)

on:
  schedule:
    - cron: '17 4 * * *' # 매일 04:17 UTC (KST 13:17)
  workflow_dispatch: {} # 수동 실행 버튼(테스트용)

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "::warning::SUPABASE_URL / SUPABASE_ANON_KEY 시크릿이 아직 설정되지 않았어요."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/game_state?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase 응답: HTTP $code"
          if [ "$code" = "200" ]; then
            echo "keep-alive 성공 — DB가 깨어 있어요."
          else
            echo "::warning::예상과 다른 응답(HTTP $code). 시크릿 값을 확인하세요. (요청 자체는 전달돼 활동으로 잡힙니다)"
          fi
